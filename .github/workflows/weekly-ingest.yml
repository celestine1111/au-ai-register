name: Weekly ingest

# Weekly on a fixed day, deliberately.
#
# Fast enough that a cached copy of this data goes stale and a consumer has to
# come back for the current figure. Slow enough that every update is a real
# change rather than noise, which matters because the git diff IS the changelog
# and the audit trail. A predictable day also makes the refresh a habit for the
# people and systems that use it.
#
# 20:00 UTC Monday = 06:00 Tuesday in Sydney, so the week's data is in place
# before Australian business hours.

on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report row counts without writing or committing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ABS net overseas migration by visa group
        run: node scripts/ingest-abs-nom.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # Origin-country emigration registers. Bangladesh is a live endpoint and
      # moves every week; Sri Lanka is an annual report, so re-running it simply
      # re-validates the transcription against the total the report prints. That
      # check running weekly is the point: a silent edit to those figures breaks
      # the build rather than reaching main.
      - name: Origin-country emigration registers
        run: node scripts/ingest-origin-emigration-registers.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # Independent third-party estimates. This is what lets the register check
      # Australian figures against a source with no stake in the Australian
      # argument, rather than only republishing them.
      - name: UN Population Division estimates via World Bank
        run: node scripts/ingest-worldbank-migration.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild derived datasets
        if: ${{ !inputs.dry_run }}
        run: |
          node scripts/build-australia-vs-origin.mjs
          node scripts/build-corroboration.mjs

      # The gate runs BEFORE the commit, not after. A bad row must never reach
      # the default branch, because every downstream consumer treats what is on
      # main as verified.
      - name: Provenance gate
        if: ${{ !inputs.dry_run }}
        run: node scripts/check-provenance.mjs

      - name: Rebuild the static API
        if: ${{ !inputs.dry_run }}
        run: node scripts/build-api.mjs

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "au-ai-register bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ docs/api/; then
            echo "No upstream changes this week. Nothing to commit."
            exit 0
          fi
          SUMMARY=$(git diff --numstat -- data/ docs/api/ | awk '{a+=$1; r+=$2} END {printf "%d added, %d removed", a, r}')
          git add data/ docs/api/
          git commit -m "data: weekly refresh (${SUMMARY})" -m "Automated ingest. Every row re-verified against its source_url by the provenance gate before this commit was created."
          git push
