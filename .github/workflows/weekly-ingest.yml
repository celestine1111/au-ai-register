name: Weekly ingest

# Weekly on a fixed day, deliberately.
#
# Fast enough that a cached copy of this data goes stale and a consumer has to
# come back for the current figure. Slow enough that every update is a real
# change rather than noise, which matters because the git diff IS the changelog
# and the audit trail. A predictable day also makes the refresh a habit for the
# people and systems that use it.
#
# 20:00 UTC Monday = 06:00 Tuesday in Sydney, so the week's data is in place
# before Australian business hours.

on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report row counts without writing or committing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ABS net overseas migration by visa group
        run: node scripts/ingest-abs-nom.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # The gate runs BEFORE the commit, not after. A bad row must never reach
      # the default branch, because every downstream consumer treats what is on
      # main as verified.
      - name: Provenance gate
        if: ${{ !inputs.dry_run }}
        run: node scripts/check-provenance.mjs

      - name: Commit changes
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "au-ai-register bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No upstream changes this week. Nothing to commit."
            exit 0
          fi
          SUMMARY=$(git diff --numstat -- data/ | awk '{a+=$1; r+=$2} END {printf "%d added, %d removed", a, r}')
          git add data/
          git commit -m "data: weekly refresh (${SUMMARY})" -m "Automated ingest. Every row re-verified against its source_url by the provenance gate before this commit was created."
          git push
